# =========================
# Query Service Configuration
# =========================

project:
  name: "PhenoBees Query Service"
  version: "0.1"

# -------------------------
# Input / Output
# -------------------------

paths:
  input_ttl: /data/kb.ttl
  ontology_dir: /data/ontologies
  queries_dir: /queries
  output_dir: /outputs

# -------------------------
# Reasoning Layer
# -------------------------

reasoning:
  enabled: true
  engine: materializer

  import_validation:
    enabled: true
    # Flatten the verified local closure before invoking Materializer.
    bundle_closure: true
    closure_file: /outputs/ontology-closure.owl
    ontology_import_map:
      http://purl.obolibrary.org/obo/bfo.owl: /data/ontologies/bfo.owl
      http://purl.obolibrary.org/obo/cdao.owl: /data/ontologies/cdao.owl
      http://purl.obolibrary.org/obo/iao.owl: /data/ontologies/iao.owl
      http://purl.obolibrary.org/obo/iao/ontology-metadata.owl: /data/ontologies/ontology-metadata.owl
      http://purl.obolibrary.org/obo/pato.owl: /data/ontologies/pato.owl
      http://purl.obolibrary.org/obo/uberon.owl: /data/ontologies/uberon-basic.owl

  semantic_validation:
    enabled: true
    # These CDAO supertypes must be inferred for this asserted standard cell.
    expected_inferred_triples:
      - subject: http://www.phenobees.org/kb#cell-016c9359-ddde-5610-9874-a5f486a89f48
        predicate: http://www.w3.org/1999/02/22-rdf-syntax-ns#type
        object: http://purl.obolibrary.org/obo/CDAO_0000089
      - subject: http://www.phenobees.org/kb#cell-016c9359-ddde-5610-9874-a5f486a89f48
        predicate: http://www.w3.org/1999/02/22-rdf-syntax-ns#type
        object: http://purl.obolibrary.org/obo/CDAO_0000098

  materializer:
    exec_path: /tools/materializer-0.2.7/bin/materializer
    ontology_file: /data/ontologies/phb.owl

    options:
      reasoner: whelk
      mark_direct_types: true
      output_indirect_types: true

# -------------------------
# Optional Query Scopes
# -------------------------

query_scopes:
  # Empty lists query all taxa and anatomical entities. Add one or more URIs to restrict results.
  taxon_uris: []
  anatomical_entity_uris: []

# -------------------------
# Query Execution
# -------------------------

queries:
  q1_taxon:
    file: q1_taxon.sparql
    enabled: true
    output: q1_taxon.csv
    pivot:
      enabled: true
      row_key: taxon
      column_key: anatomical_entity
      value_key: quality

  q2_structure:
    file: q2_structure.sparql
    enabled: true
    output: q2_structure.csv
    pivot:
      enabled: true
      row_key: taxon
      column_key: anatomical_entity
      value_key: quality

  q3_combined:
    file: q3_combined.sparql
    enabled: true
    output: q3_combined.csv
    pivot:
      enabled: true
      row_key: taxon
      column_key: anatomical_entity
      value_key: quality

# -------------------------
# SPARQL Runtime Options
# -------------------------

sparql:
  strict: true
  # Query the materialized graph when true; query paths.input_ttl when false.
  use_inference: true
  timeout_seconds: 60

# -------------------------
# Logging / Debugging
# -------------------------

logging:
  level: INFO
  save_query_logs: true
  log_file: /outputs/query_service.log

# -------------------------
# Output Formatting
# -------------------------

output:
  format: csv
  include_headers: true
  null_value: ""
  encoding: utf-8 
  pivot:
    enabled: false